[package]
edition = "2024"
rust-version = "1.88"
name = "frust-ui"
version = "0.6.3"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Frust: a Rust-native, mobile-first declarative UI framework; the facade crate application code depends on."
homepage = "https://frust.dev"
readme = "README.md"
keywords = [
    "gui",
    "ui",
    "mobile",
    "declarative",
    "wgpu",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/frust-rs/frust"

[features]
default = []
devtools = [
    "frust-shell-desktop/devtools",
    "frust-shell-android/devtools",
    "frust-shell-ios/devtools",
]
gpu = [
    "dep:frust-gpu",
    "dep:wgpu",
    "frust-shell-common/gpu",
    "frust-shell-desktop/gpu",
    "frust-shell-android/gpu",
    "frust-shell-ios/gpu",
]
hotpatch = [
    "frust-core/hotpatch",
    "frust-shell-common/hotpatch",
    "frust-shell-desktop/hotpatch",
    "frust-shell-android/hotpatch",
    "frust-shell-ios/hotpatch",
]
perf-trace = [
    "frust-shell-desktop/perf-trace",
    "frust-shell-android/perf-trace",
    "frust-shell-ios/perf-trace",
]

[lib]
name = "frust"
path = "src/lib.rs"

